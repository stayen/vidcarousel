[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidcarousel"
version = "0.1.0"
description = "Produce a music video from an audio file and a set of images, driven by a scenario file."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["video", "music-video", "slideshow", "ffmpeg", "crossfade", "xfade", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
    "typer>=0.12",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/stayen/vidcarousel-private"

[project.scripts]
vidcarousel = "vidcarousel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need real ffmpeg/ffprobe: skipped by default, run with `pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: tests that require real ffmpeg/ffprobe on PATH",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.format]
docstring-code-format = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# EntryType deliberately subclasses (str, Enum) per CLAUDE.md § 8.2.
ignore = ["UP042"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
